<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="main">
            <h1>Tasks</h1>
            <div class="taskSubHeader">
                <p id='projectHeader'>All</p><button id="open-modal" command="show-modal" commandfor="task-modal">Add Task</button>
            </div>

            <dialog id="task-modal" class="modal">
                <h1>Add Task</h1>
                <form id="add-task-form"l class='task-form' method="dialog">
                    <input type="text" name="title" id="title" class='title' placeholder="Task">
                    
                    <input type="datetime-local" name="dueDate" id="dueDate">
                

                    <select name="project" id="project" class='project'>
                        
                    </select>

                    <select name="priority" id="priority" class='priority'>
                        <option value="critical">Critical</option>
                        <option value="significant">Significant</option>
                        <option value="minor" selected>Minor</option>
                    </select>
                    
                    <textarea name="desc" id="desc"class='description' placeholder="Task Description..."></textarea>
                    
                    

                    <div class="task-button">
                        <button id="addTask" type="submit" form="add-task-form">Add Task</button>
                        <button class="close-modal" commandfor="task-modal" command="close">Close</button>
                    </div>
                </form>
                
            </dialog>
            
            <div class="tasksContainer">
                
            </div>
        </div>
        
        <div class="sidebar">
            <h1>Projects</h1>
            <button id="open-project" class="add-project" command="show-modal" commandfor="project-modal">Add Project</button>
            <div class="projectContainer">
                
            </div>
            
            <dialog id ="project-modal" class="project modal">
                <h1>Add Project</h1>
                <form id="project-form" method="dialog">
                    <label for="projectName">Project Title: </label>
                    <input type="text" name="projectName" id="projectName">
    
                    <label for="projectColor">Project Color</label>
                    <input type="color" name="projectColor" id="projectColor">
                    
                    
                </form>
                <button id="addProject" type="submit" form="project-form">Add Project</button>
                <button class="close-modal" commandfor="project-modal" command="close">Close</button>
            </dialog>
        </div>
    </div>
    
</body>
</html>
