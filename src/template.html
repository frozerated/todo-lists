<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="main">
            <h1>Tasks</h1>
            <button id="open-modal" command="show-modal" commandfor="task-modal">Add Task</button>

            <dialog id="task-modal" class="modal">
                <h1>Add Task</h1>
                <form id="task-form" method="dialog">
                    <div>
                        <label for="title">Title:</label>
                        <input type="text" name="title" id="title">
                    </div>
                    
                    <label for="dueDate">Deadline: </label>
                    <input type="datetime-local" name="dueDate" id="dueDate">
                

                    <label for="project">Project:</label>
                    <select name="project" id="project">
                        
                    </select>

                    <label for="priority">Priority:</label>
                    <select name="priority" id="priority">
                        <option value="none">None</option>
                        <option value="critical">Critical</option>
                        <option value="significant">Significant</option>
                        <option value="minor">Minor</option>
                    </select>
                    
                    <label for="desc">Description:</label>
                    <textarea name="desc" id="desc"></textarea>
                    
                    

                </form>
                <button id="addTask" type="submit" form="task-form">Add Task</button>
                <button class="close-modal" commandfor="task-modal" command="close">Close</button>
                
            </dialog>
            
            <div class="tasksContainer">
                
            </div>
        </div>
        
        <div class="sidebar">
            <h1>Projects</h1>
            <button id="open-project" class="add-project" command="show-modal" commandfor="project-modal">Add Project</button>
            <div class="projectContainer">
                
            </div>
            
            <dialog id ="project-modal" class="project modal">
                <h1>Add Project</h1>
                <form id="project-form" method="dialog">
                    
                </form>
                <label for="projectName">Project Title: </label>
                <input type="text" name="projectName" id="projectName">

                <label for="projectColor">Project Color</label>
                <input type="color" name="projectColor" id="projectColor">
                
                
                <button id="addProject" type="submit" form="project-form">Add Project</button>
                <button class="close-modal" commandfor="project-modal" command="close">Close</button>
            </dialog>
        </div>
    </div>
    
</body>
</html>
